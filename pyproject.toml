[project]
name = "numbergame"
version = "0.1.0"
description = "A rule-inference / active-learning game"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.77.0",
    "google-genai>=1.60.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "openai>=2.16.0",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
]

[project.scripts]
numbergame = "numbergame:main"
